<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" role="img" aria-label="Aditya Soni Engineering Stack Orbit and Four Technical Pillars">
  <defs>
    <linearGradient id="orbit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1c"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="orbit-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    <![CDATA[
      .orb-fast { transform-origin: 185px 195px; animation: orbSpin 16s linear infinite; }
      .orb-mid  { transform-origin: 185px 195px; animation: orbSpinRev 24s linear infinite; }
      .orb-slow { transform-origin: 185px 195px; animation: orbSpin 34s linear infinite; }
      @keyframes orbSpin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orbSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) {
        .orb-fast, .orb-mid, .orb-slow { animation: none; }
      }
    ]]>
  </style>

  <rect width="680" height="390" rx="18" fill="url(#orbit-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="185" cy="195" r="95" fill="url(#orbit-core-glow)"/>
  <circle cx="185" cy="195" r="62" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <circle cx="185" cy="195" r="102" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-dasharray="5 5"/>
  <circle cx="185" cy="195" r="142" fill="none" stroke="#2dd4bf" stroke-opacity="0.30" stroke-dasharray="6 6"/>

  <circle cx="185" cy="195" r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="185" y="191" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CORE</text>
  <text x="185" y="207" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">AI + SEC</text>

  <g class="orb-fast">
    <rect x="153" y="121" width="64" height="22" rx="11" fill="#0c2a42" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="185" y="135.5" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Python 3</text>
  </g>

  <g class="orb-mid">
    <rect x="255" y="184" width="64" height="22" rx="11" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="287" y="198.5" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Next.js</text>
    <rect x="51" y="184" width="64" height="22" rx="11" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="83" y="198.5" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">TS / JS</text>
  </g>

  <g class="orb-slow">
    <rect x="151" y="42" width="68" height="22" rx="11" fill="#0f2922" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="185" y="56.5" text-anchor="middle" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="10" font-weight="700">AppSec</text>
    <rect x="151" y="326" width="68" height="22" rx="11" fill="#0f2922" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="185" y="340.5" text-anchor="middle" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Linux</text>
  </g>

  <text x="366" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">4 Core Engineering Pillars</text>
  <line x1="366" y1="66" x2="648" y2="66" stroke="#1e293b" stroke-width="1.2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="366" y="84" width="282" height="62" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="382" y="106" fill="#38bdf8" font-size="12.5" font-weight="700">01 · Python, Backend &amp; CLI Systems</text>
    <text x="382" y="127" fill="#94a3b8" font-size="11.2">Modular CLIs, data pipelines, Pandas, automated QA</text>

    <rect x="366" y="158" width="282" height="62" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="382" y="180" fill="#818cf8" font-size="12.5" font-weight="700">02 · AI Engineering &amp; Agents</text>
    <text x="382" y="201" fill="#94a3b8" font-size="11.2">Gemini APIs, autonomous suites, workflow automation</text>

    <rect x="366" y="232" width="282" height="62" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="382" y="254" fill="#2dd4bf" font-size="12.5" font-weight="700">03 · Cybersecurity, Linux &amp; Bug Bounty</text>
    <text x="382" y="275" fill="#94a3b8" font-size="11.2">Threat analysis, OWASP, MV3 security, deepfake detection</text>

    <rect x="366" y="306" width="282" height="58" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="382" y="328" fill="#fbbf24" font-size="12.5" font-weight="700">04 · Full-Stack TypeScript &amp; React</text>
    <text x="382" y="348" fill="#94a3b8" font-size="11.2">React, Next.js, Vite, Tailwind, Chrome Extensions</text>
  </g>
</svg>
