<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" role="img" aria-label="Aditya Soni Engineering Stack Orbit and Verified Capabilities">
  <defs>
    <linearGradient id="st-d-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
      .std-fast { transform-origin: 180px 195px; animation: stdSpin 18s linear infinite; }
      .std-mid  { transform-origin: 180px 195px; animation: stdSpinRev 26s linear infinite; }
      .std-slow { transform-origin: 180px 195px; animation: stdSpin 36s linear infinite; }
      @keyframes stdSpin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes stdSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) {
        .std-fast, .std-mid, .std-slow { animation: none; }
      }
    ]]>
  </style>

  <rect width="680" height="390" rx="16" fill="#090b0f"/>
  <rect x="0.75" y="0.75" width="678.5" height="388.5" rx="15.25" fill="none" stroke="url(#st-d-edge)" stroke-width="1.5"/>

  <!-- Orbital Geometry (no radial blur blob) -->
  <circle cx="180" cy="195" r="62" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="180" cy="195" r="102" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="5 5"/>
  <circle cx="180" cy="195" r="140" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="6 6"/>

  <circle cx="180" cy="195" r="36" fill="#10141c" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="180" y="191" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CORE</text>
  <text x="180" y="207" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">AI + SEC</text>

  <g class="std-fast">
    <rect x="148" y="122" width="64" height="22" rx="6" fill="#10141c" stroke="#38bdf8" stroke-width="1.1"/>
    <text x="180" y="136.5" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10" font-weight="600">Python 3</text>
  </g>

  <g class="std-mid">
    <rect x="248" y="184" width="68" height="22" rx="6" fill="#10141c" stroke="#334155" stroke-width="1.1"/>
    <text x="282" y="198.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10" font-weight="600">React/Vite</text>
    <rect x="44" y="184" width="68" height="22" rx="6" fill="#10141c" stroke="#334155" stroke-width="1.1"/>
    <text x="78" y="198.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10" font-weight="600">TypeScript</text>
  </g>

  <g class="std-slow">
    <rect x="146" y="44" width="68" height="22" rx="6" fill="#10141c" stroke="#10b981" stroke-width="1.1"/>
    <text x="180" y="58.5" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="600">AppSec</text>
    <rect x="146" y="324" width="68" height="22" rx="6" fill="#10141c" stroke="#334155" stroke-width="1.1"/>
    <text x="180" y="338.5" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10" font-weight="600">Docker</text>
  </g>

  <!-- Right Column: Capability Matrix (no index numbering 01/02/03) -->
  <text x="360" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Engineering Focus</text>
  <line x1="360" y1="62" x2="646" y2="62" stroke="#1b222d" stroke-width="1"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="360" y="80" width="286" height="62" rx="8" fill="#10141c" stroke="#1e2531" stroke-width="1"/>
    <rect x="360" y="80" width="3" height="62" rx="1.5" fill="#38bdf8"/>
    <text x="376" y="103" fill="#f8fafc" font-size="13" font-weight="700">AI Engineering &amp; Automation</text>
    <text x="376" y="124" fill="#94a3b8" font-size="11.5">ProdForge, ScholarForge AI, Gemini API pipelines</text>

    <rect x="360" y="154" width="286" height="62" rx="8" fill="#10141c" stroke="#1e2531" stroke-width="1"/>
    <rect x="360" y="154" width="3" height="62" rx="1.5" fill="#10b981"/>
    <text x="376" y="177" fill="#f8fafc" font-size="13" font-weight="700">AppSec &amp; Browser Defense</text>
    <text x="376" y="198" fill="#94a3b8" font-size="11.5">ScamGuard AI, CyberShield, AdShield MV3 rules</text>

    <rect x="360" y="228" width="286" height="62" rx="8" fill="#10141c" stroke="#1e2531" stroke-width="1"/>
    <rect x="360" y="228" width="3" height="62" rx="1.5" fill="#64748b"/>
    <text x="376" y="251" fill="#f8fafc" font-size="13" font-weight="700">Python Backend &amp; Data</text>
    <text x="376" y="272" fill="#94a3b8" font-size="11.5">CLI tooling, Pandas pipelines, PDF/DOCX gen, Pytest</text>

    <rect x="360" y="302" width="286" height="62" rx="8" fill="#10141c" stroke="#1e2531" stroke-width="1"/>
    <rect x="360" y="302" width="3" height="62" rx="1.5" fill="#38bdf8"/>
    <text x="376" y="325" fill="#f8fafc" font-size="13" font-weight="700">TypeScript Web Applications</text>
    <text x="376" y="346" fill="#94a3b8" font-size="11.5">React, Vite, Bun, Docker Compose &amp; Oxlint</text>
  </g>
</svg>
