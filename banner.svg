<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="Aditya Soni — AI Systems, Cybersecurity, Python and TypeScript Engineer">
  <defs>
    <linearGradient id="bn-d-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bn-d-scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bn-d-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161d27" stroke-width="1"/>
    </pattern>
    <clipPath id="bn-d-role-clip">
      <rect x="60" y="196" width="560" height="48"/>
    </clipPath>
  </defs>

  <style>
    <![CDATA[
      .bnd-pulse { animation: bndPulse 2.4s ease-in-out infinite; }
      .bnd-cursor { animation: bndBlink 1s step-end infinite; }
      .bnd-scan { animation: bndScan 6s linear infinite; }
      .bnd-r1 { animation: bndR1 12s infinite; }
      .bnd-r2 { animation: bndR2 12s infinite; }
      .bnd-r3 { animation: bndR3 12s infinite; }
      .bnd-r4 { animation: bndR4 12s infinite; }
      @keyframes bndPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes bndBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes bndScan { 0% { transform: translateY(-48px); } 100% { transform: translateY(450px); } }
      @keyframes bndR1 { 0%, 21% { opacity: 1; transform: translateY(0); } 25%, 96% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes bndR2 { 0%, 22% { opacity: 0; transform: translateY(8px); } 26%, 46% { opacity: 1; transform: translateY(0); } 50%, 100% { opacity: 0; transform: translateY(-8px); } }
      @keyframes bndR3 { 0%, 47% { opacity: 0; transform: translateY(8px); } 51%, 71% { opacity: 1; transform: translateY(0); } 75%, 100% { opacity: 0; transform: translateY(-8px); } }
      @keyframes bndR4 { 0%, 72% { opacity: 0; transform: translateY(8px); } 76%, 96% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) {
        .bnd-pulse, .bnd-cursor, .bnd-scan, .bnd-r2, .bnd-r3, .bnd-r4 { animation: none; opacity: 0; }
        .bnd-r1 { animation: none; opacity: 1; transform: none; }
      }
    ]]>
  </style>

  <!-- Flat obsidian architectural surface (no purple blobs) -->
  <rect width="1200" height="440" rx="16" fill="#090b0f"/>
  <rect width="1200" height="440" rx="16" fill="url(#bn-d-grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="15.25" fill="none" stroke="url(#bn-d-edge)" stroke-width="1.5"/>

  <!-- Top Studio Header Bar -->
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1b222d" stroke-width="1"/>
  <circle cx="70" cy="38" r="4.5" fill="#10b981" class="bnd-pulse"/>
  <text x="84" y="42" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">Open to SDE, AI &amp; AppSec Internships</text>
  <text x="1140" y="42" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">Bhilai, IN · B.Tech CSE 2026–2030</text>

  <!-- Left Identity Column -->
  <text x="60" y="122" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">@mradityasonicse</text>
  <text x="60" y="182" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">Aditya Soni</text>

  <g clip-path="url(#bn-d-role-clip)">
    <text x="60" y="226" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="bnd-r1">AI Engineering &amp; Autonomous Tooling</text>
    <text x="60" y="226" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="bnd-r2">AppSec, Threat Triage &amp; Chrome MV3</text>
    <text x="60" y="226" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="bnd-r3">Python Backend &amp; CLI Automation</text>
    <text x="60" y="226" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" class="bnd-r4">TypeScript, React &amp; Vite Systems</text>
  </g>

  <text x="60" y="274" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">Building autonomous code-hardening suites, defensive security</text>
  <text x="60" y="297" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">engines, MV3 blockers, and TypeScript web applications.</text>

  <!-- Concrete Verified Proof Strip -->
  <line x1="60" y1="336" x2="600" y2="336" stroke="#1b222d" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="60" y="366" fill="#f8fafc" font-size="20" font-weight="700">32</text>
    <text x="60" y="386" fill="#64748b" font-size="12">Public repos (0 forks)</text>

    <text x="240" y="366" fill="#38bdf8" font-size="20" font-weight="700">381</text>
    <text x="240" y="386" fill="#64748b" font-size="12">Yearly contributions</text>

    <text x="420" y="366" fill="#10b981" font-size="20" font-weight="700">RISU</text>
    <text x="420" y="386" fill="#64748b" font-size="12">B.Tech CSE · Bhilai</text>
  </g>

  <!-- Right Column: Authentic System Spec Window -->
  <rect x="646" y="92" width="494" height="304" rx="12" fill="#10141c" stroke="#242d3c" stroke-width="1.2"/>
  <rect x="646" y="92" width="494" height="36" rx="12" fill="#151b26"/>
  <rect x="646" y="116" width="494" height="12" fill="#151b26"/>
  <line x1="646" y1="128" x2="1140" y2="128" stroke="#242d3c" stroke-width="1"/>
  <circle cx="670" cy="110" r="4.5" fill="#475569"/>
  <circle cx="686" cy="110" r="4.5" fill="#475569"/>
  <circle cx="702" cy="110" r="4.5" fill="#475569"/>
  <text x="722" y="114" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">scamguard_triage.py</text>
  <text x="1122" y="114" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Python 3.12</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="670" y="158" fill="#64748b"># Verified public repos · mradityasonicse</text>
    <text x="670" y="184" fill="#38bdf8">from <tspan fill="#e2e8f0">scamguard </tspan><tspan fill="#38bdf8">import </tspan><tspan fill="#e2e8f0">DetectorEngine</tspan></text>
    <text x="670" y="208" fill="#38bdf8">from <tspan fill="#e2e8f0">cybershield </tspan><tspan fill="#38bdf8">import </tspan><tspan fill="#e2e8f0">PrivacyGuard</tspan></text>

    <text x="670" y="244" fill="#e2e8f0">engine <tspan fill="#64748b">= </tspan><tspan fill="#38bdf8">DetectorEngine</tspan>()</text>
    <text x="670" y="268" fill="#e2e8f0">sanitized <tspan fill="#64748b">= </tspan><tspan fill="#38bdf8">PrivacyGuard</tspan>.scrub(payload)</text>
    <text x="670" y="292" fill="#e2e8f0">verdict <tspan fill="#64748b">= </tspan>engine.inspect_apk_or_url(sanitized)</text>

    <text x="670" y="328" fill="#38bdf8">if <tspan fill="#e2e8f0">verdict.risk_score &gt;= 0.75:</tspan></text>
    <text x="690" y="352" fill="#10b981">export_rescue_pdf(verdict, lang="hi-en")</text>

    <rect x="670" y="368" width="8" height="14" fill="#38bdf8" class="bnd-cursor"/>
  </g>

  <rect x="0" y="0" width="1200" height="40" fill="url(#bn-d-scan)" class="bnd-scan"/>
</svg>
