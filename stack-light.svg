<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="100%" role="img" aria-label="Aditya Soni Engineering Stack Orbit and Verified Capabilities (Light)">
  <style>
    <![CDATA[
      .stl-fast { transform-origin: 180px 195px; animation: stlSpin 18s linear infinite; }
      .stl-mid  { transform-origin: 180px 195px; animation: stlSpinRev 26s linear infinite; }
      .stl-slow { transform-origin: 180px 195px; animation: stlSpin 36s linear infinite; }
      @keyframes stlSpin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes stlSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) {
        .stl-fast, .stl-mid, .stl-slow { animation: none; }
      }
    ]]>
  </style>

  <rect width="680" height="390" rx="16" fill="#f8fafc"/>
  <rect x="0.75" y="0.75" width="678.5" height="388.5" rx="15.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <circle cx="180" cy="195" r="62" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
